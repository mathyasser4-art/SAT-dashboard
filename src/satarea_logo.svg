<svg viewBox="0 0 250 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="satareaApexGrad" x1="24" y1="4" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="satareaLeftFacet" x1="16" y1="12" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="satareaRightFacet" x1="32" y1="12" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="satareaWingLeft" x1="4" y1="18" x2="20" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="satareaWingRight" x1="44" y1="18" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="satareaWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <filter id="satareaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crystalline Emblem -->
  <g class="satarea-emblem" filter="url(#satareaGlow)">
    <!-- Pinnacle Center Left -->
    <polygon points="24,4 17,18 24,36" fill="url(#satareaLeftFacet)" />
    <!-- Pinnacle Center Right -->
    <polygon points="24,4 31,18 24,36" fill="url(#satareaRightFacet)" />
    <!-- Core Ridge Reflection -->
    <polygon points="24,4 23.5,36 24.5,36" fill="#BAE6FD" opacity="0.85" />

    <!-- Left Wing Upper -->
    <polygon points="15,14 4,20 13,28 20,23" fill="url(#satareaWingLeft)" />
    <!-- Left Wing Lower -->
    <polygon points="13,29 6,36 18,37 20,30" fill="#1D4ED8" opacity="0.9" />

    <!-- Right Wing Upper -->
    <polygon points="33,14 44,20 35,28 28,23" fill="url(#satareaWingRight)" />
    <!-- Right Wing Lower -->
    <polygon points="35,29 42,36 30,37 28,30" fill="#1D4ED8" opacity="0.9" />

    <!-- Lower Diamond Apex -->
    <polygon points="24,44 19,37 24,36 29,37" fill="#38BDF8" />

    <!-- Crystalline Highlight Facets -->
    <polygon points="24,4 17,18 24,19" fill="#E0F2FE" opacity="0.65" />
    <polygon points="24,4 31,18 24,19" fill="#93C5FD" opacity="0.45" />
  </g>

  <!-- Typography -->
  <g class="satarea-wordmark">
    <text
      x="56"
      y="33"
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif"
      font-size="26"
      font-weight="900"
      letter-spacing="1.2px"
      fill="#0F172A"
      class="satarea-text-sat"
    >
      SAT
    </text>
    <text
      x="122"
      y="33"
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif"
      font-size="26"
      font-weight="800"
      letter-spacing="1px"
      fill="url(#satareaWordGrad)"
      class="satarea-text-area"
    >
      AREA
    </text>
    <!-- Accent Dot -->
    <circle cx="214" cy="21" r="3.2" fill="#38BDF8" />
  </g>
</svg>
