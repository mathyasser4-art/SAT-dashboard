<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 32" width="100%" height="100%" fill="none">
  <!-- Exact Hostinger-Style Minimalist Geometric Mark -->
  <g fill="#FFFFFF">
    <!-- Left Vertical Pillar -->
    <rect x="0" y="2" width="6.5" height="28" rx="0.5" />
    
    <!-- Right Vertical Pillar -->
    <rect x="23.5" y="2" width="6.5" height="28" rx="0.5" />
    
    <!-- Upper Slanted Bar -->
    <polygon points="6.5,10.5 23.5,7 23.5,11.2 6.5,14.7" />
    
    <!-- Lower Slanted Bar -->
    <polygon points="6.5,19.3 23.5,15.8 23.5,20 6.5,23.5" />
  </g>

  <!-- Wordmark: MR.SHAHIN in exact Hostinger typography -->
  <text 
    x="44" 
    y="23.5" 
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
    font-size="18.5" 
    font-weight="800" 
    letter-spacing="2.2px" 
    fill="#FFFFFF"
  >
    MR.SHAHIN
  </text>
</svg>
